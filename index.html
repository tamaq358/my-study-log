<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f5ef" />
    <meta name="description" content="日々の学習内容と時間を記録する、シンプルな学習ログです。" />
    <title>学びのログ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="editor-panel" aria-labelledby="app-title">
        <div class="brand-row">
          <div>
            <p class="eyebrow">STUDY LOG <span>01 / DAILY</span></p>
            <h1 id="app-title">学びの<span>ログ</span></h1>
            <p class="intro-copy">今日の一歩を、明日の自分につなげよう。</p>
          </div>
          <div class="save-state" id="save-state" aria-live="polite"><span class="status-dot"></span>未保存</div>
        </div>

        <form id="study-form" class="diary-form">
          <div class="field-row">
            <label class="field-label" for="entry-date">学習した日</label>
          <input id="entry-date" name="date" type="date" required />
          </div>

          <div class="field-row field-row-split">
            <div>
              <label class="field-label" for="entry-subject">学習した分野</label>
              <select id="entry-subject" name="subject" required>
                <option value="" disabled selected>分野を選ぶ</option>
                <option>英語</option><option>数学</option><option>国語</option><option>理科</option>
                <option>社会</option><option>プログラミング</option><option>読書</option><option>その他</option>
              </select>
            </div>
            <div>
              <label class="field-label" for="entry-minutes">学習時間</label>
              <div class="number-field"><input id="entry-minutes" name="minutes" type="number" min="1" max="1440" step="1" placeholder="45" required /><span>分</span></div>
            </div>
          </div>

          <label class="field-label" for="entry-learned">今日学んだこと</label>
          <textarea
            id="entry-learned"
            name="learned"
            rows="4"
            maxlength="500"
            placeholder="解けるようになった問題や、気づいたことを書こう"
            required
          ></textarea>

          <label class="field-label" for="entry-next">次にやること <span class="optional-label">任意</span></label>
          <input class="text-input" id="entry-next" name="next" type="text" maxlength="140" placeholder="例：練習問題をもう3問解く" />
          <p class="note-meta" id="editing-label">今日の学習を記録</p>

          <div class="action-row">
            <button class="primary-button" type="submit">記録を保存 <span aria-hidden="true">→</span></button>
            <button class="ghost-button" type="button" id="clear-button">クリア</button>
          </div>
        </form>
      </section>

      <section class="history-panel" aria-labelledby="history-title">
        <div class="history-header">
          <div>
            <p class="eyebrow">YOUR PROGRESS</p>
            <h2 id="history-title">学習の積み上げ</h2>
          </div>
          <div class="stats-strip" aria-label="学習記録の件数">
            <strong id="entry-count">0</strong><span>件の記録</span>
          </div>
        </div>

        <section class="progress-panel" aria-labelledby="progress-title">
          <div class="progress-heading">
            <div><p class="biorhythm-label">TOTAL STUDY TIME</p><h3 id="progress-title">続けた時間</h3></div>
            <strong class="total-time" id="total-time">0分</strong>
          </div>
          <p class="chart-caption">直近7日間の学習時間 <span>分</span></p>
          <div class="weekly-chart" id="weekly-chart" aria-label="直近7日間の学習時間"></div>
        </section>

        <div class="list-tools">
          <label class="search-box" for="search-input">
            <span class="visually-hidden">記録を検索</span>
            <input id="search-input" type="search" placeholder="学んだことを検索" />
          </label>
          <select id="subject-filter" aria-label="分野で絞り込み">
            <option value="all">すべての分野</option>
            <option>英語</option><option>数学</option><option>国語</option><option>理科</option>
            <option>社会</option><option>プログラミング</option><option>読書</option><option>その他</option>
          </select>
        </div>

        <div id="empty-state" class="empty-state">
          <strong>学びの記録を始めましょう</strong>
          <span>学習した分野と内容を保存すると、ここに積み重なります。</span>
        </div>

        <ul id="entry-list" class="entry-list" aria-label="保存した学習記録一覧"></ul>
      </section>
    </main>

    <script src="study-log.js"></script>
  </body>
</html>
